
name: Build Stardew Performance Optimizer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore StardewPerformanceOptimizer.vbproj

      - name: Build mod
        run: dotnet build StardewPerformanceOptimizer.vbproj --configuration Release --no-restore

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: StardewPerformanceOptimizer
          path: bin/Release/net6.0/StardewPerformanceOptimizer.dll
          
