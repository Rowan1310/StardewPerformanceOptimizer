
name: Build Stardew Performance Optimizer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SMAPI build environment
        uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@v1

      - name: Restore dependencies
        run: dotnet restore StardewPerformanceOptimizer.vbproj

      - name: Build mod
        run: dotnet build StardewPerformanceOptimizer.vbproj --configuration Release --no-restore

      - name: Upload compiled DLL
        uses: actions/upload-artifact@v4
        with:
          name: StardewPerformanceOptimizer-DLL
          path: bin/Release/net6.0/StardewPerformanceOptimizer.dll
          
